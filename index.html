<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Điểm danh barcode</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--in:#16a34a;--out:#ea580c;--err:#dc2626}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);max-width:560px;margin:0 auto;transition:box-shadow .15s}
  body.flash-ok{box-shadow:inset 0 0 0 8px #22c55e}
  body.flash-bad{box-shadow:inset 0 0 0 8px #ef4444}
  h1{font-size:18px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
  .badge{font-size:12px;background:var(--card);padding:4px 10px;border-radius:99px;color:var(--mut)}
  select{width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;font-size:16px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .modes button{padding:16px;font-size:18px;font-weight:700;border:3px solid transparent;border-radius:14px;background:var(--card);color:var(--mut)}
  .modes button.active.in{background:var(--in);color:#fff;border-color:#86efac}
  .modes button.active.out{background:var(--out);color:#fff;border-color:#fdba74}
  .cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
  video{width:100%;height:100%;object-fit:cover}
  .frame{position:absolute;left:8%;right:8%;top:35%;bottom:35%;border:3px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
  .frame::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#ef4444;animation:p 1.6s infinite}
  @keyframes p{50%{opacity:.2}}
  .start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.9)}
  .start button{font-size:18px;padding:14px 26px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700}
  .tools{display:flex;gap:8px;margin:8px 0}
  .tools button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:14px}
  .manual{display:flex;gap:8px;margin-bottom:10px}
  .manual input{flex:1;padding:12px;font-size:16px;border-radius:10px;border:1px solid #334155;background:var(--card);color:var(--tx)}
  .manual button{padding:0 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}
  .result{border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card);min-height:84px}
  .result.ok{background:#14532d}.result.bad{background:#7f1d1d}.result.wait{background:#1e3a8a}
  .result b{font-size:20px;display:block}
  .result small{color:#e2e8f0;opacity:.85}
  ul{list-style:none;padding:0;margin:0 0 20px}
  li{background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  li .l{color:var(--err)} li .g{color:#4ade80}
  li small{color:var(--mut);display:block}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
  .tabs button{padding:11px;border:0;border-radius:10px;background:var(--card);color:var(--mut);font-size:15px;font-weight:700}
  .tabs button.active{background:#2563eb;color:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
  .chip{flex:0 0 auto;border:2px solid transparent;border-radius:10px;background:var(--card);color:var(--mut);padding:7px 10px;font-size:13px;font-weight:700;text-align:center}
  .chip small{display:block;font-size:12px;font-weight:400;color:var(--tx)}
  .chip.on{border-color:#60a5fa;color:#fff}
  .tbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin-bottom:8px;flex-wrap:wrap}
  .tbar button{border:0;border-radius:8px;background:var(--card);color:var(--tx);padding:8px 12px;font-size:13px}
  .tbar label{display:flex;align-items:center;gap:6px}
  #summary{background:var(--card);border-radius:12px;padding:12px;font-size:18px;margin-bottom:10px}
  #summary .miss{color:#f87171;font-weight:700}
  .grp{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  .grp header{display:flex;justify-content:space-between;gap:8px;font-size:15px}
  .bar{height:6px;background:#334155;border-radius:9px;margin:8px 0;overflow:hidden}
  .bar div{height:100%;background:#22c55e}
  .lbl{font-size:12px;color:#f87171;margin:6px 0 4px;font-weight:700}.lbl.ok{color:#4ade80}
  .person{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;border-radius:9px;padding:9px 10px;margin-bottom:5px;background:#0f172a;color:var(--tx);font-size:14px}
  .person small{display:block;color:var(--mut);font-size:12px}
  .person i{font-style:normal;font-size:13px}.person.miss i{color:#f87171}.person.here i{color:#4ade80}
  details summary{font-size:13px;color:var(--mut);padding:6px 0}
  .empty{text-align:center;color:var(--mut);padding:24px}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
  #modal.show{display:flex}
  #modal .box{background:var(--card);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
  #modal h2{margin:0 0 2px;font-size:19px}
  #modal table{width:100%;border-collapse:collapse;margin:10px 0;font-size:14px}
  #modal td,#modal th{padding:7px 4px;border-bottom:1px solid #334155;text-align:left}
  #modal .yes{color:#4ade80}#modal .no{color:#f87171}
  #modal a.call{display:inline-block;margin:6px 0;padding:8px 14px;border-radius:9px;background:#16a34a;color:#fff;text-decoration:none;font-weight:700}
  #modal .x{width:100%;padding:12px;border:0;border-radius:10px;background:#334155;color:#fff;font-size:15px;margin-top:8px}
</style>
</head>
<body>
<h1>Điểm danh TV/CTV <span class="badge" id="net">…</span></h1>

<nav class="tabs"><button id="tabScan" class="active">📷 Quét</button><button id="tabTeam">👥 DANH SÁCH</button></nav>
<div id="pgScan">
<select id="sess">
  <option value="">Buổi: tự động theo giờ</option>
  <option value="0">SÁNG 3/10</option><option value="1">CHIỀU 3/10</option>
  <option value="2">SÁNG 4/10</option><option value="3">CHIỀU 4/10</option><option value="4">TỐI 4/10</option>
</select>

<div class="modes">
  <button id="mIn" class="in active">CHECK IN</button>
  <button id="mOut" class="out">CHECK OUT</button>
</div>

<div class="cam">
  <video id="video" playsinline webkit-playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="start" id="start"><button id="startBtn">Bật camera quét</button></div>
</div>

<div class="tools">
  <button id="torch" style="display:none">🔦 Đèn</button>
  <button id="flip">🔄 Đổi camera</button>
  <button id="sync">⟳ Gửi lại (<span id="pend">0</span>)</button>
</div>

<div class="manual">
  <input id="manual" inputmode="numeric" maxlength="8" placeholder="Nhập tay MSSV 8 số">
  <button id="manualBtn">Gửi</button>
</div>

<div class="result" id="result"><b>Sẵn sàng quét</b><small>Chọn CHECK IN hoặc CHECK OUT rồi đưa mã vào khung.</small></div>
<ul id="history"></ul>
</div>

<div id="pgTeam" style="display:none">
  <div class="chips" id="chips"></div>
  <div class="tbar"><button id="teamReload">⟳ Tải lại</button><label><input type="checkbox" id="onlyMiss" checked> Chỉ nhóm còn thiếu</label><span id="teamInfo"></span></div>
  <div id="summary">…</div>
  <div id="groups"></div>
</div>
<div id="modal"><div class="box" id="modalBox"></div></div>


<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// ====== CẤU HÌNH ======
const API_URL   = 'https://script.google.com/macros/s/AKfycbwE5uzG3RArxjrvFjK2ZZeG6TDm6RPqIRyGzFvIA0a4oD_GqCmwHcZBgPU8GL8_e1LK/exec';
const TOKEN     = 'CEER';
const DEVICE    = localStorage.getItem('dev') || (localStorage.setItem('dev', 'TB-' + Math.random().toString(36).slice(2,6)), localStorage.getItem('dev'));
const DEDUPE_MS = 1500;   // mã phải VẮNG MẶT khỏi khung ít nhất ngần này ms mới được quét lại
const TIMEOUT_MS = 8000;
const SCAN_INTERVAL = 40;
// ======================

const $ = id => document.getElementById(id);
const video = $('video');
let mode = 'in', stream = null, facing = 'environment', scanning = false, track = null, torchOn = false;
let lastCode = '', lastAt = 0, audioCtx = null, detector = null, timer = null, startToken = 0;
const inflight = new Set();
let STUDENT_DB = {};

fetch('students.json').then(r => r.json()).then(d => { STUDENT_DB = d; })
  .catch(() => console.warn('Không thấy students.json, sẽ đợi server xác thực.'));

const dispName = s => (!s || !s.name || s.name === 'nan') ? '' : s.name;

function setMode(m){
  mode = m;
  $('mIn').classList.toggle('active', m === 'in');
  $('mOut').classList.toggle('active', m === 'out');
}
$('mIn').onclick = () => setMode('in');
$('mOut').onclick = () => setMode('out');

// ---- Âm thanh / phản hồi (Safari: cần resume trong thao tác chạm) ----
function getAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
  return audioCtx;
}
function tone(freq, dur, vol){
  const a = getAudio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.frequency.value = freq; g.gain.value = vol;
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function feedback(ok){
  if(ok){ tone(1000, .12, .2); }
  else { tone(300, .18, .2); setTimeout(() => tone(300, .18, .2), 230); }
  if(navigator.vibrate) navigator.vibrate(ok ? 60 : [120,60,120]);
  document.body.classList.remove('flash-ok','flash-bad');
  document.body.classList.add(ok ? 'flash-ok' : 'flash-bad');
  setTimeout(() => document.body.classList.remove('flash-ok','flash-bad'), 400);
}

// ---- Camera ----
async function startCamera(){
  stopCamera();
  const my = ++startToken;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
  }catch(e){
    setResult('bad', 'Không mở được camera', 'Cấp quyền camera và dùng HTTPS. ' + e.message);
    return;
  }
  if(my !== startToken){ stream.getTracks().forEach(t => t.stop()); return; }
  video.srcObject = stream;
  await video.play().catch(()=>{});
  track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  $('torch').style.display = caps.torch ? '' : 'none';
  // Lấy nét liên tục nếu thiết bị hỗ trợ
  if(caps.focusMode && caps.focusMode.includes('continuous')){
    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(()=>{});
  }
  $('start').style.display = 'none';
  scanning = true;

  if('BarcodeDetector' in window){
    try{
      const sup = await BarcodeDetector.getSupportedFormats();
      if(sup.includes('code_128')){
        detector = new BarcodeDetector({ formats: ['code_128'] });
        loopNative(); return;
      }
    }catch(e){ detector = null; }
  }
  initZXing();
  loopZXing(); // Safari / iOS đi đường này
}

function stopCamera(){
  scanning = false; clearTimeout(timer);
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function loopNative(){
  if(!scanning) return;
  detector.detect(video).then(r => { if(r.length) onCode(r[0].rawValue); }).catch(()=>{})
    .finally(() => { timer = setTimeout(loopNative, SCAN_INTERVAL); });
}

// ---- ZXing: chỉ Code 128. Mỗi khung: quét NHANH; cứ 4 khung mới quét KỸ ----
let zrFast = null, zrHard = null, canvas = null, cctx = null, frameNo = 0;
function mkReader(hard){
  const Z = window.ZXing, r = new Z.MultiFormatReader(), h = new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128]);
  if(hard) h.set(Z.DecodeHintType.TRY_HARDER, true);
  r.setHints(h); return r;
}
function initZXing(){
  if(zrFast) return;
  zrFast = mkReader(false); zrHard = mkReader(true);
  canvas = document.createElement('canvas');
  cctx = canvas.getContext('2d', { willReadFrequently: true });
}
function loopZXing(){
  if(!scanning) return;
  const t0 = performance.now();
  const vw = video.videoWidth, vh = video.videoHeight;
  if(vw && video.readyState >= 2){
    const Z = window.ZXing;
    const sw = Math.round(vw * 0.9), sh = Math.round(vh * 0.25);
    const sx = Math.round((vw - sw) / 2), sy = Math.round((vh - sh) / 2);
    const k = Math.min(1, 800 / sw);               // tối đa 800px ngang => giải mã nhanh hơn ~2x
    canvas.width = Math.round(sw * k); canvas.height = Math.round(sh * k);
    cctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
    try{
      const bmp = new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(canvas)));
      const rd = (++frameNo % 4 === 0) ? zrHard : zrFast;
      onCode(rd.decode(bmp).getText());
    }catch(e){ /* chưa thấy mã */ }
  }
  // Bù thời gian giải mã: không bao giờ chờ thừa
  timer = setTimeout(loopZXing, Math.max(0, SCAN_INTERVAL - (performance.now() - t0)));
}

$('startBtn').onclick = () => { getAudio(); tone(800, .06, .1); startCamera(); };
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; if(scanning) startCamera(); };
$('torch').onclick = async () => { torchOn = !torchOn; try{ await track.applyConstraints({ advanced: [{ torch: torchOn }] }); }catch(e){} };
document.addEventListener('visibilitychange', () => {
  if(document.hidden) stopCamera();
  else if($('start').style.display === 'none') startCamera();
});

// ---- Nhận mã ----
function onCode(raw){
  const m = String(raw || '').match(/\d{8}/);
  if(!m) return;
  const mssv = m[0], now = Date.now();
  if(mssv === lastCode && now - lastAt < DEDUPE_MS){ lastAt = now; return; }  // vẫn đang giữ thẻ: gia hạn, không quét lại
  if(inflight.has(mssv)) return;
  lastCode = mssv; lastAt = now;

  const label = mode === 'in' ? 'CHECK IN' : 'CHECK OUT';
  if(Object.keys(STUDENT_DB).length > 0){
    const s = STUDENT_DB[mssv];
    if(!s){
      feedback(false);
      setResult('bad', mssv, 'Không có MSSV này trong danh sách!');
      addHistory(false, mssv, 'Không tìm thấy');
      return;
    }
    // Báo OK NGAY (không chờ Sheet); server chỉ phát thêm âm thanh nếu từ chối
    feedback(true);
    setResult('ok', dispName(s) || mssv, `${label} · ${s.role}\n⏳ Đang ghi lên Sheet…`);
  }else{
    setResult('wait', mssv, label + ' · Đang gửi…');
  }
  submit(mssv, Object.keys(STUDENT_DB).length > 0);
}

$('manualBtn').onclick = () => {
  const v = $('manual').value.trim();
  if(!/^\d{8}$/.test(v)){ setResult('bad', 'MSSV phải đủ 8 số', ''); return; }
  $('manual').value = '';
  onCode(v);
};

// ---- Gửi + hàng đợi offline ----
const getQ = () => { try{ return JSON.parse(localStorage.getItem('queue') || '[]'); }catch(e){ return []; } };
const setQ = q => { localStorage.setItem('queue', JSON.stringify(q)); $('pend').textContent = q.length; };

function submit(mssv, opt){
  const item = {
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
    mssv, type: mode, session: $('sess').value, ts: new Date().toISOString(), device: DEVICE, token: TOKEN, opt: !!opt
  };
  // Lưu vào hàng đợi NGAY: nếu tắt trình duyệt giữa chừng vẫn không mất lượt quét
  const q = getQ(); q.push(item); setQ(q);
  inflight.add(mssv);
  send(item, true).finally(() => inflight.delete(mssv));
}

async function send(item, interactive){
  const ctl = new AbortController();
  const to = setTimeout(() => ctl.abort(), TIMEOUT_MS);
  try{
    const res = await fetch(API_URL, {
      method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(item), signal: ctl.signal
    });
    const r = await res.json();
    if(r.code === 'BUSY') throw new Error('busy');
    setQ(getQ().filter(x => x.id !== item.id));
    showServerResult(item, r);
    return true;
  }catch(e){
    if(interactive){
      const busy = e.message === 'busy';
      setResult('wait', item.mssv, busy
        ? 'Máy chủ đang bận — đã lưu, sẽ tự gửi lại.'
        : 'Chưa kết nối được — đã lưu ngoại tuyến, sẽ tự gửi lại.');
    }
    return false;
  }finally{ clearTimeout(to); }
}

function showServerResult(item, r){
  const label = item.type === 'in' ? 'CHECK IN' : 'CHECK OUT';
  const nm = r.name && r.name !== 'nan' ? r.name : (r.mssv || item.mssv);
  if(r.ok){
    if(!item.opt) feedback(true);
    setResult('ok', nm, `${label} · ${r.session} · ${r.time}\n✔ Đã ghi Sheet · ${r.mssv} · ${r.cls || ''}`);
    addHistory(true, nm, `${label} ${r.time}`);
  }else{
    feedback(false);
    setResult('bad', nm, r.message || 'Lỗi');
    addHistory(false, nm, r.message || 'Lỗi');
  }
}

let syncing = false;
async function flush(){
  if(syncing) return;
  syncing = true;
  try{
    for(const it of getQ()){
      if(inflight.has(it.mssv)) continue;   // đang gửi thủ công
      const ok = await send(it, false);
      if(!ok) break;
    }
  }finally{ syncing = false; }
}
$('sync').onclick = flush;
setInterval(flush, 15000);
window.addEventListener('online', flush);

// ---- Giao diện ----
function setResult(cls, title, sub){
  const el = $('result');
  el.className = 'result ' + cls;
  el.innerHTML = '';
  const b = document.createElement('b'); b.textContent = title;
  const s = document.createElement('small'); s.style.whiteSpace = 'pre-line'; s.textContent = sub || '';
  el.append(b, s);
}
function addHistory(ok, name, note){
  const li = document.createElement('li');
  const a = document.createElement('div'); a.textContent = name;
  const sm = document.createElement('small'); sm.textContent = note; a.append(sm);
  const t = document.createElement('span'); t.className = ok ? 'g' : 'l'; t.textContent = ok ? '✔' : '✖';
  li.append(a, t);
  const h = $('history'); h.prepend(li);
  while(h.children.length > 15) h.lastChild.remove();
}
function net(){ $('net').textContent = (navigator.onLine ? '● Online' : '○ Offline') + ' · ' + DEVICE; }
window.addEventListener('online', net); window.addEventListener('offline', net);
net(); setQ(getQ());

// ================= TAB ĐỘI NGŨ =================
const SESS_NAMES = ['SÁNG 3/10','CHIỀU 3/10','SÁNG 4/10','CHIỀU 4/10','TỐI 4/10'];
const SESS_WIN = [['2026-10-03',7,12.5],['2026-10-03',12.5,20],['2026-10-04',3,11.5],['2026-10-04',11.5,15.5],['2026-10-04',15.5,23]];
const STATUS_REFRESH_MS = 20000;
let TEAM = null, teamSess = -1, teamTimer = null, loadingTeam = false;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pname = p => (p.n && p.n !== 'nan') ? p.n : (dispName(STUDENT_DB[p.m]) || p.m);

function autoSess(){
  const n = new Date(), pad = x => String(x).padStart(2, '0');
  const d = n.getFullYear() + '-' + pad(n.getMonth() + 1) + '-' + pad(n.getDate());
  const h = n.getHours() + n.getMinutes() / 60;
  const i = SESS_WIN.findIndex(w => w[0] === d && h >= w[1] && h < w[2]);
  return i >= 0 ? i : (d > '2026-10-03' ? 2 : 0);
}

function showTab(t){
  const team = t === 'team';
  $('pgScan').style.display = team ? 'none' : '';
  $('pgTeam').style.display = team ? '' : 'none';
  $('tabScan').classList.toggle('active', !team);
  $('tabTeam').classList.toggle('active', team);
  clearInterval(teamTimer);
  if(team){
    stopCamera(); $('start').style.display = 'flex';   // Safari: quay lại tab Quét phải chạm "Bật camera"
    if(teamSess < 0) teamSess = autoSess();
    if(TEAM) renderTeam();
    loadTeam();
    teamTimer = setInterval(() => { if(!document.hidden) loadTeam(); }, STATUS_REFRESH_MS);
  }
}
$('tabScan').onclick = () => showTab('scan');
$('tabTeam').onclick = () => showTab('team');
$('teamReload').onclick = () => loadTeam();
$('onlyMiss').onchange = () => renderTeam();

async function loadTeam(){
  if(loadingTeam) return;
  loadingTeam = true;
  $('teamInfo').textContent = 'Đang tải…';
  const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 15000);
  try{
    const r = await fetch(API_URL + '?action=status&token=' + encodeURIComponent(TOKEN), { signal: ctl.signal });
    const d = await r.json();
    if(!d.ok) throw new Error(d.message || 'Lỗi');
    TEAM = d; renderTeam();
    $('teamInfo').textContent = 'Cập nhật ' + new Date().toLocaleTimeString('vi-VN');
  }catch(e){
    $('teamInfo').textContent = 'Không tải được' + (TEAM ? ' (đang hiện dữ liệu cũ)' : '') + ': ' + e.message;
  }finally{ clearTimeout(to); loadingTeam = false; }
}

function renderTeam(){
  if(!TEAM) return;
  const P = TEAM.people, s = teamSess, key = s < 2 ? 'tN' : 'tO';   // 3/10 -> cột N, 4/10 -> cột O
  $('chips').innerHTML = SESS_NAMES.map((nm, i) => {
    const reg = P.filter(p => p.reg[i]), got = reg.filter(p => p.a[i * 2]).length;
    return `<button class="chip${i === s ? ' on' : ''}" data-s="${i}">${nm}<small>${got}/${reg.length}</small></button>`;
  }).join('');

  const mem = P.filter(p => p.reg[s] || p.a[s * 2]);   // đã đăng ký ca này, hoặc đã quét dù không đăng ký
  const groups = {};
  mem.forEach(p => { const k = (p[key] || '').trim() || 'Chưa phân team'; (groups[k] = groups[k] || []).push(p); });
  const list = Object.entries(groups).map(([name, ms]) => {
    const exp = ms.filter(p => p.reg[s]);
    return { name, ms, exp: exp.length, here: exp.filter(p => p.a[s * 2]).length };
  }).sort((a, b) => (a.name === 'Chưa phân team') - (b.name === 'Chưa phân team') || b.exp - a.exp);

  const tot = list.reduce((a, g) => a + g.exp, 0), got = list.reduce((a, g) => a + g.here, 0);
  $('summary').innerHTML = tot
    ? `${SESS_NAMES[s]}: <b>${got}/${tot}</b> đã đến · <span class="miss">${tot - got} vắng</span>`
    : `${SESS_NAMES[s]}: chưa có ai đăng ký ca này`;

  const only = $('onlyMiss').checked;
  const row = (p, cls) => `<button class="person ${cls}" data-m="${esc(p.m)}"><span>${esc(pname(p))}<small>${esc(p.m)} · ${esc(p.r)}${p.reg[s] ? '' : ' · ngoài đăng ký'}</small></span><i>${cls === 'miss' ? '✖ vắng' : esc(p.a[s * 2])}</i></button>`;
  $('groups').innerHTML = list.filter(g => !only || g.here < g.exp).map(g => {
    const miss = g.ms.filter(p => p.reg[s] && !p.a[s * 2]);
    const here = g.ms.filter(p => p.a[s * 2]);
    const pct = g.exp ? Math.round(g.here * 100 / g.exp) : 0;
    return `<section class="grp"><header><b>${esc(g.name)}</b><span>${g.here}/${g.exp}</span></header>
      <div class="bar"><div style="width:${pct}%"></div></div>
      ${miss.length ? `<div class="lbl">Còn vắng (${miss.length})</div>` + miss.map(p => row(p, 'miss')).join('') : '<div class="lbl ok">✔ Đã đủ</div>'}
      ${here.length ? `<details><summary>Đã đến (${here.length})</summary>${here.map(p => row(p, 'here')).join('')}</details>` : ''}</section>`;
  }).join('') || '<div class="empty">Không có nhóm nào còn thiếu 🎉</div>';
}

$('chips').onclick = e => {
  const b = e.target.closest('.chip'); if(!b) return;
  teamSess = Number(b.dataset.s); renderTeam();
};
$('groups').onclick = e => {
  const b = e.target.closest('.person'); if(b) openPerson(b.dataset.m);
};

function openPerson(m){
  const p = TEAM && TEAM.people.find(x => x.m === m); if(!p) return;
  const yn = v => v ? '<span class="yes">✔ Có</span>' : '<span class="no">✖ Không</span>';
  const rows = SESS_NAMES.map((nm, i) => {
    const a = p.a[i * 2], o = p.a[i * 2 + 1];
    return `<tr><td>${nm}</td><td>${yn(p.reg[i])}</td><td>${a ? esc(a) + (o ? ' → ' + esc(o) : ' (chưa out)') : '<span class="no">chưa quét</span>'}</td></tr>`;
  }).join('');
  $('modalBox').innerHTML = `
    <h2>${esc(pname(p))}</h2>
    <div style="color:var(--mut);font-size:14px">${esc(p.m)} · ${esc(p.r)}</div>
    ${p.p ? `<a class="call" href="tel:${esc(p.p)}">📞 ${esc(p.p)}</a>` : ''}
    <table><tr><th>Ca</th><th>Đăng ký</th><th>Check in → out</th></tr>${rows}</table>
    ${p.h ? `<div style="font-size:14px;margin-bottom:6px"><b>Đăng ký (theo form):</b><br>${esc(p.h)}</div>` : ''}
    <div style="font-size:14px"><b>Team 3/10:</b> ${esc(p.tN || '—')}<br><b>Team 4/10:</b> ${esc(p.tO || '—')}</div>
    ${p.note ? `<div style="font-size:14px;margin-top:6px"><b>Ghi chú:</b> ${esc(p.note)}</div>` : ''}
    <button class="x" id="modalClose">Đóng</button>`;
  $('modal').classList.add('show');
  $('modalClose').onclick = () => $('modal').classList.remove('show');
}
$('modal').onclick = e => { if(e.target.id === 'modal') $('modal').classList.remove('show'); };
</script>
</body>
</html>
