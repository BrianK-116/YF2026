<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Điểm danh barcode</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--tx:#f1f5f9;--mut:#94a3b8;--in:#16a34a;--out:#ea580c;--err:#dc2626}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);max-width:560px;margin:0 auto}
  h1{font-size:18px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}
  .badge{font-size:12px;background:var(--card);padding:4px 10px;border-radius:99px;color:var(--mut)}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .modes button{padding:16px;font-size:18px;font-weight:700;border:3px solid transparent;border-radius:14px;background:var(--card);color:var(--mut)}
  .modes button.active.in{background:var(--in);color:#fff;border-color:#86efac}
  .modes button.active.out{background:var(--out);color:#fff;border-color:#fdba74}
  .cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
  video{width:100%;height:100%;object-fit:cover}
  .frame{position:absolute;left:8%;right:8%;top:35%;bottom:35%;border:3px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
  .frame::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#ef4444;animation:p 1.6s infinite}
  @keyframes p{50%{opacity:.2}}
  .start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,.9)}
  .start button{font-size:18px;padding:14px 26px;border:0;border-radius:12px;background:#2563eb;color:#fff;font-weight:700}
  .tools{display:flex;gap:8px;margin:8px 0}
  .tools button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);color:var(--tx);font-size:14px}
  .manual{display:flex;gap:8px;margin-bottom:10px}
  .manual input{flex:1;padding:12px;font-size:16px;border-radius:10px;border:1px solid #334155;background:var(--card);color:var(--tx)}
  .manual button{padding:0 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:700}
  .result{border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card);min-height:84px}
  .result.ok{background:#14532d}.result.bad{background:#7f1d1d}.result.wait{background:#1e3a8a}
  .result b{font-size:20px;display:block}
  .result small{color:#e2e8f0;opacity:.85}
  ul{list-style:none;padding:0;margin:0 0 20px}
  li{background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:14px;display:flex;justify-content:space-between;gap:8px}
  li .l{color:var(--err)} li .g{color:#4ade80}
  li small{color:var(--mut);display:block}
</style>
</head>
<body>
<h1>Điểm danh TV/CTV <span class="badge" id="net">…</span></h1>

<select id="sess" style="width:100%;padding:10px;margin-bottom:10px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#f1f5f9;font-size:15px">
  <option value="">Buổi: tự động theo giờ</option>
  <option value="0">SÁNG 3/10</option><option value="1">CHIỀU 3/10</option>
  <option value="2">SÁNG 4/10</option><option value="3">CHIỀU 4/10</option><option value="4">TỐI 4/10</option>
</select>

<div class="modes">
  <button id="mIn" class="in active">CHECK IN</button>
  <button id="mOut" class="out">CHECK OUT</button>
</div>

<div class="cam">
  <video id="video" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="start" id="start"><button id="startBtn">Bật camera quét</button></div>
</div>

<div class="tools">
  <button id="torch" style="display:none">🔦 Đèn</button>
  <button id="flip">🔄 Đổi camera</button>
  <button id="sync">⟳ Gửi lại (<span id="pend">0</span>)</button>
</div>

<div class="manual">
  <input id="manual" inputmode="numeric" maxlength="8" placeholder="Nhập tay MSSV 8 số">
  <button id="manualBtn">Gửi</button>
</div>

<div class="result" id="result"><b>Sẵn sàng quét</b><small>Chọn CHECK IN hoặc CHECK OUT rồi đưa mã vào khung.</small></div>
<ul id="history"></ul>

<!-- Thư viện dự phòng quét mã -->
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
// ====== CẤU HÌNH ======
const API_URL   = 'https://script.google.com/macros/s/AKfycbwE5uzG3RArxjrvFjK2ZZeG6TDm6RPqIRyGzFvIA0a4oD_GqCmwHcZBgPU8GL8_e1LK/exec';
const TOKEN     = 'CEER';
const DEVICE    = localStorage.getItem('dev') || (localStorage.setItem('dev', 'TB-' + Math.random().toString(36).slice(2,6)), localStorage.getItem('dev'));
const DEDUPE_MS = 3000;
// ======================

const $ = id => document.getElementById(id);
const video = $('video');
let mode = 'in', stream = null, facing = 'environment', scanning = false, track = null, torchOn = false;
let lastCode = '', lastAt = 0, audioCtx = null, reader = null, detector = null, timer = null;
const inflight = new Set();
let STUDENT_DB = {};

// 1. Tải sẵn dữ liệu danh sách sinh viên từ file local
fetch('students.json')
  .then(res => res.json())
  .then(data => {
    STUDENT_DB = data;
    console.log('Đã nạp dữ liệu cục bộ:', Object.keys(data).length, 'người');
  })
  .catch(() => console.warn('Không thấy students.json, sẽ đợi server xác thực.'));

// 2. Chế độ Check in / Check out
function setMode(m){ 
  mode = m; 
  $('mIn').classList.toggle('active', m === 'in');$('mOut').classList.toggle('active', m === 'out'); 
}
$('mIn').onclick = () => setMode('in');$('mOut').onclick = () => setMode('out');

// 3. Âm thanh & Rung
function beep(ok){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.frequency.value = ok ? 1000 : 300; 
    g.gain.value = .15;
    o.connect(g); g.connect(audioCtx.destination); 
    o.start(); o.stop(audioCtx.currentTime + (ok ? .12 : .35));
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate(ok ? 60 : [120,60,120]);
}

// 4. Quản lý Camera
async function startCamera(){
  stopCamera();
  const constraints = { 
    audio: false, 
    video: { facingMode: { ideal: facing }, width: { ideal: 640 }, height: { ideal: 480 } } 
  };
  try{
    stream = await navigator.mediaDevices.getUserMedia(constraints);
  }catch(e){
    setResult('bad', 'Không mở được camera', 'Hãy cấp quyền camera và dùng HTTPS. ' + e.message); 
    return;
  }
  video.srcObject = stream; 
  await video.play().catch(()=>{});
  track = stream.getVideoTracks()[0];
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  $('torch').style.display = caps.torch ? '' : 'none';
  $('start').style.display = 'none';
  scanning = true;

  if('BarcodeDetector' in window){
    try{
      const want = ['code_128','code_39','ean_13','ean_8','itf','codabar','code_93','upc_a','qr_code'];
      const sup = await BarcodeDetector.getSupportedFormats();
      detector = new BarcodeDetector({ formats: want.filter(f => sup.includes(f)) });
      loopNative(); 
      return;
    }catch(e){ detector = null; }
  }
  startZXing();
}

function stopCamera(){
  scanning = false; clearTimeout(timer);
  if(reader){ try{reader.reset();}catch(e){} reader = null; }
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream = null; }
}

function loopNative(){
  if(!scanning) return;
  detector.detect(video).then(r => { if(r.length) onCode(r[0].rawValue); }).catch(()=>{})
    .finally(()=>{ timer = setTimeout(loopNative, 50); });
}

function startZXing(){
  const Z = window.ZXing;
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.EAN_13,
    Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.ITF, Z.BarcodeFormat.CODABAR, Z.BarcodeFormat.CODE_93, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.QR_CODE]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  reader = new Z.BrowserMultiFormatReader(hints, 60);
  reader.decodeFromStream(stream, video, (res) => { if(res) onCode(res.getText()); }).catch(()=>{});
}

$('startBtn').onclick = () => { beep(true); startCamera(); };
$('flip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; if(scanning) startCamera(); };$('torch').onclick = async () => { torchOn = !torchOn; try{ await track.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){} };
document.addEventListener('visibilitychange', () => { if(document.hidden) stopCamera(); else if($('start').style.display === 'none') startCamera(); });

// 5. Xử lý khi nhận mã vạch
function onCode(raw){
  const m = String(raw || '').match(/\d{8}/);
  if(!m) return;
  const mssv = m[0], now = Date.now();
  if(mssv === lastCode && now - lastAt < DEDUPE_MS) return;
  if(inflight.has(mssv)) return;
  lastCode = mssv; lastAt = now;

  // Đối soát tức thì bằng dữ liệu local (nếu đã nạp)
  if(Object.keys(STUDENT_DB).length > 0){
    const s = STUDENT_DB[mssv];
    if(!s){
      beep(false);
      setResult('bad', mssv, 'Không có MSSV này trong danh sách!');
      addHistory(false, mssv, 'Không tìm thấy');
      return;
    }
    beep(true);
    setResult('wait', s.name, `${mode === 'in' ? 'CHECK IN' : 'CHECK OUT'} · ${s.role}\nĐang đồng bộ lên Sheet…`);
  }

  submit(mssv);
}

$('manualBtn').onclick = () => {
  const v = $('manual').value.trim();
  if(!/^\d{8}$/.test(v)){ setResult('bad', 'MSSV phải đủ 8 số', ''); return; }
  $('manual').value = ''; 
  onCode(v);
};

// 6. Gửi dữ liệu và xử lý Offline Queue
const getQ = () => JSON.parse(localStorage.getItem('queue') || '[]');
const setQ = q => { localStorage.setItem('queue', JSON.stringify(q)); $('pend').textContent = q.length; };

function submit(mssv){
  const item = { 
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random(),
    mssv, type: mode, session: $('sess').value, ts: new Date().toISOString(), device: DEVICE, token: TOKEN 
  };
  inflight.add(mssv);
  if(Object.keys(STUDENT_DB).length === 0){
    setResult('wait', mssv, (mode === 'in' ? 'CHECK IN' : 'CHECK OUT') + ' · Đang gửi…');
  }
  send(item).finally(() => inflight.delete(mssv));
}

async function send(item){
  try{
    const res = await fetch(API_URL, { 
      method: 'POST', 
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
      body: JSON.stringify(item) 
    });
    const r = await res.json();
    if(r.code === 'BUSY') throw new Error('busy');
    showServerResult(item, r);
    setQ(getQ().filter(x => x.id !== item.id));
    return true;
  }catch(e){
    const q = getQ(); 
    if(!q.find(x => x.id === item.id)) q.push(item); 
    setQ(q);
    setResult('wait', item.mssv, 'Chưa kết nối Sheet — Đã lưu ngoại tuyến, sẽ tự gửi lại.');
    beep(false);
    return false;
  }
}

function showServerResult(item, r){
  const label = item.type === 'in' ? 'CHECK IN' : 'CHECK OUT';
  if(r.ok){
    beep(true);
    setResult('ok', r.name || r.mssv, `${label} · ${r.session} · ${r.time}\n${r.mssv} · ${r.cls || ''}`);
    addHistory(true, r.name || r.mssv, `${label} ${r.time}`);
  }else{
    beep(false);
    setResult('bad', r.name ? r.name : (r.mssv || item.mssv), r.message || 'Lỗi');
    addHistory(false, r.name || item.mssv, r.message || 'Lỗi');
  }
}

let syncing = false;
async function flush(){
  if(syncing) return; 
  syncing = true;
  for(const it of getQ()){ 
    const ok = await send(it); 
    if(!ok) break; 
  }
  syncing = false;
}
$('sync').onclick = flush;
setInterval(flush, 15000);
window.addEventListener('online', flush);

// 7. Render giao diện
function setResult(cls, title, sub){
  const el = $('result'); 
  el.className = 'result ' + cls;
  el.innerHTML = ''; 
  const b = document.createElement('b'); 
  b.textContent = title;
  const s = document.createElement('small'); 
  s.style.whiteSpace = 'pre-line'; 
  s.textContent = sub || '';
  el.append(b, s);
}

function addHistory(ok, name, note){
  const li = document.createElement('li');
  const a = document.createElement('div'); 
  a.textContent = name;
  const sm = document.createElement('small'); 
  sm.textContent = note; 
  a.append(sm);
  const t = document.createElement('span'); 
  t.className = ok ? 'g' : 'l'; 
  t.textContent = ok ? '✔' : '✖';
  li.append(a, t); 
  const h = $('history'); 
  h.prepend(li); 
  while(h.children.length > 15) h.lastChild.remove();
}

function net(){ $('net').textContent = (navigator.onLine ? '● Online' : '○ Offline') + ' · ' + DEVICE; }
window.addEventListener('online', net); 
window.addEventListener('offline', net); 
net(); 
setQ(getQ());
</script>
</body>
</html>
